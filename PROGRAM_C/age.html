
<!DOCTYPE html>
<html>
<head>
    <title>Age Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="container">

    <h1>Age Verification System</h1>
    <p class="subtitle">Check Your Eligibility</p>

    <div class="card">

        <div class="icon">🛡️</div>

        <h2>Verify Your Age</h2>

        <p>Enter your name and age to continue.</p>

        <form action="check_age.php" method="POST">

            <input type="text"
                   name="name"
                   placeholder="Enter your name"
                   required>

            <input type="number"
                   name="age"
                   placeholder="Enter your age"
                   min="0"
                   required>

            <button type="submit">Check Eligibility →</button>

        </form>

    </div>

    <p class="footer">PHP Age Verification Application</p>

</div>

</body>
</html>
